name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release tag, e.g. v0.5.0'
        required: true
      publish:
        description: 'create a GitHub release'
        type: boolean
        default: false
      torch_version:
        description: 'torch version to build with (cpu wheel)'
        required: false
        default: '2.14.1'
      whats_new:
        description: 'markdown for the What''s New section (blank = generic line)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${{ inputs.torch_version }}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binaries
        run: pyinstaller --clean --noconfirm neonify.spec
      - name: Smoke test CLI (linux)
        if: matrix.platform == 'linux'
        run: |
          ./dist/neonify/neonify --help > /dev/null
          ./dist/neonify/neonify info | grep -q "PyTorch"
      - name: Smoke test CLI (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & .\dist\neonify\neonify.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = & .\dist\neonify\neonify.exe info
          if (-not (($out | Out-String) -match 'PyTorch')) { exit 1 }
      - name: Package (linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p stage/neonify
          cp -r dist/neonify/. stage/neonify/
          cp packaging/linux/cli.sh stage/neonify/
          cp packaging/linux/install.sh stage/neonify/
          chmod +x stage/neonify/cli.sh stage/neonify/install.sh stage/neonify/neonify
          tar -czf neonify-cpu-linux_${{ inputs.version }}.tar.gz -C stage neonify
      - name: Package (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/neonify | Out-Null
          Copy-Item dist/neonify/* stage/neonify/ -Recurse -Force
          Copy-Item packaging/windows/*.bat stage/neonify/
          Compress-Archive -Path stage/neonify -DestinationPath "neonify-cpu-windows_${{ inputs.version }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neonify-cpu-${{ matrix.platform }}
          path: neonify-cpu-*
      - name: Create release
        if: inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          python - <<'PY'
          import os
          template = open('.github/release_template.md', encoding='utf-8').read()
          whats_new = os.environ.get('WHATS_NEW', '').strip()
          if not whats_new:
              whats_new = 'Initial public package of Neonify v0.5.0 — neon art for images, videos, audio and 3D meshes, pure math, zero AI.'
          body = template.replace('{{VERSION}}', os.environ['RELEASE_VERSION']).replace('{{WHATS_NEW}}', whats_new)
          open('release_body.md', 'w', encoding='utf-8').write(body)
          PY
          gh release view "${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --title "${{ inputs.version }}" --notes-file release_body.md || true
          gh release edit "${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --title "${{ inputs.version }}" --notes-file release_body.md
          gh release upload "${{ inputs.version }}" neonify-cpu-* --repo "$GITHUB_REPOSITORY" --clobber
