name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release tag, e.g. v0.5.0'
        required: true
      publish:
        description: 'replace the release assets in-place'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binaries
        run: pyinstaller --clean --noconfirm neonify.spec
      - name: Smoke test (linux)
        if: matrix.platform == 'linux'
        run: |
          ./dist/neonify/neonify --help > /dev/null
          ./dist/neonify/neonify profiles | grep -q "slash"
      - name: Smoke test (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\neonify\neonify.exe -ArgumentList "--help" -NoNewWindow -Wait -PassThru -RedirectStandardOutput out.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package (linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p stage/neonify
          cp -r dist/neonify/. stage/neonify/
          cp packaging/linux/cli.sh stage/neonify/
          cp packaging/linux/install.sh stage/neonify/
          chmod +x stage/neonify/cli.sh stage/neonify/install.sh stage/neonify/neonify
          cat > stage/neonify/README.txt <<EOF
          NEONIFY v${{ inputs.version }} - python build (linux)

          ./neonify      the app. no args = gui, "./neonify cli" = interactive cli
          ffmpeg         install once: sudo apt install ffmpeg

          outputs land in results/ next to the app.
          EOF
          tar -czf "neonify linux python v${{ inputs.version }}.tar.gz" -C stage neonify
      - name: Package (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/neonify | Out-Null
          Copy-Item dist/neonify/* stage/neonify/ -Recurse -Force
          Copy-Item packaging/windows/*.bat stage/neonify/
          $readme = @"
          NEONIFY v${{ inputs.version }} - python build (windows)

          neonify.exe   the app. double-click = gui
          cli.bat       interactive cli
          cmd.bat       terminal here
          ffmpeg        install once: winget install FFmpeg

          outputs land in results\ next to the app.
          "@
          $readme | Out-File -Encoding utf8 stage\neonify\README.txt
          Compress-Archive -Path stage/neonify -DestinationPath "neonify windows python v${{ inputs.version }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neonify-python-${{ matrix.platform }}
          path: neonify *python*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pkgs
      - name: replace release assets in-place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"
          for a in $(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.tag_name==\"$TAG\") | .assets[].name"); do
            case "$a" in
              *"python"*)
                id=$(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.tag_name==\"$TAG\") | .assets[] | select(.name==\"$a\") | .id")
                gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/assets/$id
                ;;
            esac
          done
          gh release upload "$TAG" \
            "pkgs/neonify-python-windows/neonify windows python v$TAG.zip" \
            "pkgs/neonify-python-linux/neonify linux python v$TAG.tar.gz" \
            --clobber
