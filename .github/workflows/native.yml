name: native build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release version without the v, e.g. 0.5.0 (tag becomes v0.5.0)'
        required: true
      publish:
        description: 'replace the release assets in-place'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-cpp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: cache static qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: D:\qts
          key: qt-5.15-static-msvc-v4

      - name: build static qt 5.15.2 (base + multimedia)
        if: steps.qtcache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git clone --depth 1 -b 5.15 https://github.com/qt/qtbase D:\src\qtbase
          git clone --depth 1 -b 5.15 https://github.com/qt/qtmultimedia D:\src\qtmultimedia
          curl -L -o D:\jom.zip https://download.qt.io/official_releases/jom/jom.zip || exit /b 1
          mkdir D:\jom && tar -xf D:\jom.zip -C D:\jom
          for /r D:\jom %%i in (jom.exe) do set "JOM=%%i"
          if not defined JOM exit /b 1
          echo using jom at %JOM%
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir D:\src\build && cd /d D:\src\build
          call ..\qtbase\configure.bat -static -static-runtime -release -opensource -confirm-license -prefix D:\qts -nomake examples -nomake tests -platform win32-msvc -opengl desktop -no-openssl -no-dbus || exit /b 1
          "%JOM%" -j4 || exit /b 1
          "%JOM%" -j4 install || exit /b 1
          cd /d D:\src\qtmultimedia
          D:\qts\bin\qmake.exe || exit /b 1
          "%JOM%" -j4 || exit /b 1
          "%JOM%" -j4 install || exit /b 1

      - name: cache static opencv
        id: ocvcache
        uses: actions/cache@v4
        with:
          path: |
            D:\src\ocvbuild
            D:\src\opencv
          key: opencv-4.10.0-static-msvc-v4

      - name: build static opencv (core imgproc imgcodecs)
        if: steps.ocvcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Test-Path D:\src\opencv\CMakeLists.txt) { Write-Host "opencv source cached"; exit 0 }
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv D:\src\opencv
          cmake -S D:\src\opencv -B D:\src\ocvbuild -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_BUILD_TYPE=Release" "-DBUILD_SHARED_LIBS=OFF" `
            "-DBUILD_LIST=core,imgproc,imgcodecs" "-DBUILD_TESTS=OFF" "-DBUILD_PERF_TESTS=OFF" `
            "-DBUILD_EXAMPLES=OFF" "-DBUILD_opencv_apps=OFF" "-DBUILD_JPEG=ON" "-DBUILD_PNG=ON" `
            "-DBUILD_ZLIB=ON" "-DBUILD_WEBP=ON" "-DBUILD_TIFF=ON" "-DBUILD_OPENEXR=OFF" `
            "-DWITH_IPP=OFF" "-DWITH_ITT=OFF" "-DWITH_TBB=OFF" `
            "-DWITH_FFMPEG=OFF" "-DWITH_GTK=OFF" "-DWITH_OPENEXR=OFF" "-DWITH_JASPER=OFF" "-DENABLE_LIBJPEG_TURBO_SIMD=OFF"
          cmake --build D:\src\ocvbuild --config Release -j 4

      - name: generate static plugin imports
        shell: pwsh
        run: |
          python scripts\gen_plugins.py D:\src\gen\neon_plugins.h D:\src\qtbase D:\src\qtmultimedia windows
          New-Item -ItemType Directory -Force -Path src\cpp\src | Out-Null
          Copy-Item D:\src\gen\neon_plugins.h src\cpp\src\neon_plugins.h

      - name: build neonify (single exe, /MT, WIN32)
        shell: pwsh
        run: |
          cmake -S src/cpp -B build -G "Visual Studio 17 2022" -A x64 `
            -DQt5_DIR="D:\qts\lib\cmake\Qt5" `
            -DOpenCV_DIR="D:\src\ocvbuild"
          cmake --build build --config Release -j 4

      - name: smoke test (the real exe, image + audio)
        shell: pwsh
        run: |
          $out = & build\Release\neonify.exe image test_assets\text.png 2>&1 | Out-String
          Write-Host $out
          if (-not (Test-Path "results\*_neonify_*.png")) { Write-Host "image smoke FAILED - no output"; exit 1 }
          $outki = & build\Release\neonify.exe image test_assets\text.png --keep-inside 2>&1 | Out-String
          Write-Host $outki
          $ki = Get-ChildItem "results\*_neonify_*.png" | Measure-Object
          if ($ki.Count -lt 2) { Write-Host "keep-inside smoke FAILED"; exit 1 }
          $outj = & build\Release\neonify.exe image test_assets\text.jpg 2>&1 | Out-String
          Write-Host $outj
          $all = Get-ChildItem "results\*" | Measure-Object
          if ($all.Count -lt 3) { Write-Host "jpg smoke FAILED"; exit 1 }
          $outs = & build\Release\neonify.exe image test_assets\sweep.png --palette spectrum 2>&1 | Out-String
          Write-Host $outs
          $spec = Get-ChildItem "results\*_neonify_spectrum_*.png" | Measure-Object
          if ($spec.Count -lt 1) { Write-Host "spectrum smoke FAILED"; exit 1 }
          New-Item -ItemType Directory -Force -Path "unicode dir" | Out-Null
          Copy-Item test_assets\text.png "unicode dir\ñéo öü.png"
          $outu = & build\Release\neonify.exe image "unicode dir\ñéo öü.png" 2>&1 | Out-String
          Write-Host $outu
          $uni = Get-ChildItem "results\*neonify*.png" | Measure-Object
          if ($uni.Count -lt 3) { Write-Host "unicode path smoke FAILED"; exit 1 }
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ff) {
            $out2 = & build\Release\neonify.exe audio test_assets\stereo.wav 2>&1 | Out-String
            Write-Host $out2
            if (-not (Test-Path "results\*_neonify_*.wav")) { Write-Host "audio smoke FAILED - no output"; exit 1 }
          } else { Write-Host "ffmpeg not on runner - audio smoke skipped" }
          Write-Host "smoke OK"

      - name: collect portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\neonify | Out-Null
          Copy-Item build\Release\neonify.exe dist\neonify\
          Copy-Item packaging\windows\cli.bat dist\neonify\
          Copy-Item packaging\windows\cmd.bat dist\neonify\
          Compress-Archive -Path dist\neonify -DestinationPath "neonify-windows-cpp-v${{ inputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: neonify-windows-cpp
          path: neonify-windows-cpp-v${{ inputs.version }}.zip

  linux-cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libglib2.0-dev ninja-build \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev xvfb

      - name: cache static qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: /opt/qts
          key: qt-5.15-static-linux-v4

      - name: build static qt 5.15.2 (base + multimedia)
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b 5.15 https://github.com/qt/qtbase /opt/src/qtbase
          git clone --depth 1 -b 5.15 https://github.com/qt/qtmultimedia /opt/src/qtmultimedia
          mkdir -p /opt/src/build && cd /opt/src/build
          ../qtbase/configure -static -release -opensource -confirm-license \
            -prefix /opt/qts -nomake examples -nomake tests -nomake tools \
            -xcb -opengl desktop -no-openssl -no-dbus
          make -j"$(nproc)"
          make install
          cd /opt/src/qtmultimedia
          /opt/qts/bin/qmake
          make -j"$(nproc)"
          make install

      - name: cache static opencv
        id: ocvcache
        uses: actions/cache@v4
        with:
          path: |
            /opt/src/ocvbuild
            /opt/src/opencv
          key: opencv-4.10.0-static-linux-v4

      - name: build static opencv
        if: steps.ocvcache.outputs.cache-hit != 'true'
        run: |
          if [ -f /opt/src/opencv/CMakeLists.txt ]; then echo "opencv source cached"; exit 0; fi
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv /opt/src/opencv
          cmake -S /opt/src/opencv -B /opt/src/ocvbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,imgproc,imgcodecs -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF -DBUILD_JPEG=ON -DBUILD_PNG=ON \
            -DBUILD_ZLIB=ON -DBUILD_WEBP=ON -DBUILD_TIFF=ON -DBUILD_OPENEXR=OFF \
            -DBUILD_JPEG2000=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_TBB=OFF \
            -DWITH_FFMPEG=OFF -DWITH_GTK=OFF -DWITH_OPENEXR=OFF -DWITH_JASPER=OFF -DENABLE_LIBJPEG_TURBO_SIMD=OFF
          cmake --build /opt/src/ocvbuild -j "$(nproc)"

      - name: generate static plugin imports
        run: |
          python3 scripts/gen_plugins.py /opt/src/gen/neon_plugins.h /opt/src/qtbase /opt/src/qtmultimedia linux
          cp /opt/src/gen/neon_plugins.h src/cpp/src/neon_plugins.h

      - name: build neonify
        run: |
          cmake -S src/cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQt5_DIR=/opt/qts/lib/cmake/Qt5 -DOpenCV_DIR=/opt/src/ocvbuild
          cmake --build build -j "$(nproc)"

      - name: smoke test (the real binary, image)
        run: |
          sha256sum test_assets/text.jpg test_assets/text.png
          stat -c%s test_assets/text.jpg
          command -v ffmpeg ffprobe || echo "no ffmpeg/ffprobe on runner"
          cat > /tmp/probe.cpp << 'EOF'
          #include <opencv2/core.hpp>
          #include <opencv2/imgcodecs.hpp>
          #include <cstdio>
          #include <vector>
          int main() {
              FILE* f = fopen("test_assets/text.jpg", "rb");
              if (!f) { std::printf("probe: fopen FAILED\n"); return 1; }
              fseek(f, 0, SEEK_END); long sz = ftell(f); fseek(f, 0, SEEK_SET);
              std::vector<unsigned char> buf(sz);
              size_t got = fread(buf.data(), 1, sz, f); fclose(f);
              std::printf("probe: size %ld read %zu\n", sz, got);
              cv::Mat m = cv::imdecode(buf, cv::IMREAD_COLOR);
              std::printf("probe: imdecode empty=%d\n", m.empty() ? 1 : 0);
              cv::Mat d = cv::imread("test_assets/text.jpg");
              std::printf("probe: imread empty=%d\n", d.empty() ? 1 : 0);
              return 0;
          }
          EOF
          g++ -O1 /tmp/probe.cpp -I/opt/src/opencv/modules/core/include \
            -I/opt/src/opencv/modules/imgcodecs/include -I/opt/src/opencv/modules/imgproc/include \
            -I/opt/src/ocvbuild -o /tmp/probe \
            -Wl,--start-group /opt/src/ocvbuild/lib/libopencv_imgcodecs.a \
            /opt/src/ocvbuild/lib/libopencv_imgproc.a /opt/src/ocvbuild/lib/libopencv_core.a \
            /opt/src/ocvbuild/3rdparty/lib/libjpeg-turbo.a /opt/src/ocvbuild/3rdparty/lib/liblibwebp.a \
            /opt/src/ocvbuild/3rdparty/lib/liblibpng.a /opt/src/ocvbuild/3rdparty/lib/liblibtiff.a \
            /opt/src/ocvbuild/3rdparty/lib/libzlib.a -Wl,--end-group -lpthread -ldl -lm || echo "probe compile failed"
          /tmp/probe || true
          ./build/neonify image test_assets/text.png
          ls results/*_neonify_*.png > /dev/null || { echo "image smoke FAILED"; exit 1; }
          ./build/neonify image test_assets/text.png --keep-inside
          [ $(ls results/*_neonify_*.png | wc -l) -ge 2 ] || { echo "keep-inside smoke FAILED"; exit 1; }
          ./build/neonify image test_assets/text.jpg
          [ $(ls results/ | wc -l) -ge 3 ] || { echo "jpg smoke FAILED"; exit 1; }
          ./build/neonify image test_assets/sweep.png --palette spectrum
          [ $(ls results/*_neonify_spectrum_*.png | wc -l) -ge 1 ] || { echo "spectrum smoke FAILED"; exit 1; }
          mkdir -p "unicode dir"
          cp test_assets/text.png "unicode dir/ñéo öü.png"
          ./build/neonify image "unicode dir/ñéo öü.png"
          [ $(ls results/*neonify*.png | wc -l) -ge 3 ] || { echo "unicode path smoke FAILED"; exit 1; }
          echo "smoke OK"

      - name: gui startup smoke (xvfb, 8s alive)
        run: |
          code=0
          timeout 8 xvfb-run -a ./build/neonify gui || code=$?
          if [ $code -ne 124 ] && [ $code -ne 0 ]; then echo "gui startup smoke FAILED (exit $code)"; exit 1; fi
          echo "gui startup OK"

      - name: collect portable bundle
        run: |
          mkdir -p dist/neonify
          cp build/neonify dist/neonify/
          cp packaging/linux/cli.sh dist/neonify/ 2>/dev/null || true
          chmod +x dist/neonify/neonify
          tar -czf "neonify-linux-cpp-v${{ inputs.version }}.tar.gz" -C dist neonify

      - uses: actions/upload-artifact@v4
        with:
          name: neonify-linux-cpp
          path: neonify-linux-cpp-v${{ inputs.version }}.tar.gz

  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: build
        run: pyinstaller --clean --noconfirm neonify.spec
      - name: collect portable bundle
        shell: pwsh
        run: |
          Copy-Item packaging\windows\cli.bat dist\neonify\
          Copy-Item packaging\windows\cmd.bat dist\neonify\
          Compress-Archive -Path dist\neonify -DestinationPath "neonify-windows-python-v${{ inputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: neonify-windows-python
          path: neonify-windows-python-v${{ inputs.version }}.zip

  linux-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: build
        run: pyinstaller --clean --noconfirm neonify.spec
      - name: collect portable bundle
        run: |
          cp packaging/linux/cli.sh dist/neonify/ 2>/dev/null || true
          cp packaging/linux/install.sh dist/neonify/ 2>/dev/null || true
          tar -czf "neonify-linux-python-v${{ inputs.version }}.tar.gz" -C dist neonify
      - uses: actions/upload-artifact@v4
        with:
          name: neonify-linux-python
          path: neonify-linux-python-v${{ inputs.version }}.tar.gz

  release:
    needs: [windows-cpp, linux-cpp, windows-python, linux-python]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: pkgs

      - name: replace release assets in-place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          for a in $(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.tag_name==\"$TAG\") | .assets[].name"); do
            id=$(gh api repos/$GITHUB_REPOSITORY/releases --jq ".[] | select(.tag_name==\"$TAG\") | .assets[] | select(.name==\"$a\") | .id")
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/assets/$id
          done
          gh release upload "$TAG" \
            "pkgs/neonify-windows-cpp/neonify-windows-cpp-$TAG.zip" \
            "pkgs/neonify-linux-cpp/neonify-linux-cpp-$TAG.tar.gz" \
            "pkgs/neonify-windows-python/neonify-windows-python-$TAG.zip" \
            "pkgs/neonify-linux-python/neonify-linux-python-$TAG.tar.gz" \
            --clobber
